<svg id="lumis-lockup" data-asset="lumis-lockup.svg" viewBox="0 0 340 70" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="lckMarkGrad" x1="16" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#67E8F9"/>
                  <stop offset="100%" stop-color="#A78BFA"/>
                </linearGradient>
              </defs>

              <!-- Mark Emblem -->
              <g transform="translate(4, 5)">
                <!-- Ambient Projection Frustum -->
                <polygon points="6,9 54,6 46,53 10,49" stroke="#262E40" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

                <!-- Main Keystone Quad -->
                <polygon points="16,17 48,13 42,47 13,44" fill="url(#lckMarkGrad)" fill-opacity="0.25"/>
                <polygon points="16,17 48,13 42,47 13,44" stroke="url(#lckMarkGrad)" stroke-width="2" stroke-linejoin="round"/>

                <!-- Reflection -->
                <polygon points="16,17 34,24 27,45 13,44" fill="#FFFFFF" fill-opacity="0.25"/>

                <!-- Center Reticle -->
                <circle cx="30" cy="30" r="2" stroke="#67E8F9" stroke-width="1"/>
                <circle cx="30" cy="30" r="0.75" fill="#67E8F9"/>

                <!-- Calibration Corners -->
                <circle cx="16" cy="17" r="2.5" fill="#090B10" stroke="#67E8F9" stroke-width="1.5"/>
                <circle cx="48" cy="13" r="2.5" fill="#090B10" stroke="#A78BFA" stroke-width="1.5"/>
                <circle cx="42" cy="47" r="2.5" fill="#090B10" stroke="#A78BFA" stroke-width="1.5"/>
                <circle cx="13" cy="44" r="2.5" fill="#090B10" stroke="#67E8F9" stroke-width="1.5"/>
              </g>

              <!-- Precise Vector Typography: LUMIS -->
              <!-- Letter L -->
              <path d="M 82 22 L 82 48 L 96 48" stroke="#F4F5FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Letter U -->
              <path d="M 106 22 L 106 41 C 106 46 110 49 116 49 C 122 49 126 46 126 41 L 126 22" stroke="#F4F5FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Letter M -->
              <path d="M 137 48 L 137 22 L 147 38 L 157 22 L 157 48" stroke="#F4F5FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Letter I -->
              <path d="M 169 22 L 169 48" stroke="#F4F5FA" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Letter S -->
              <path d="M 197 26 C 195 23 189 22 185 24 C 180 26 180 30 184 33 L 191 37 C 196 40 197 44 194 47 C 191 50 183 50 179 46" stroke="#F4F5FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- Category Descriptor: PROJECTION STUDIO -->
              <text x="83" y="60" fill="#9CA8BA" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="2.8">PROJECTION STUDIO</text>
            </svg>