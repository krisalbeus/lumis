<svg id="empty-canvas.svg" data-asset="empty-canvas.svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer 16:9 Viewport Guide -->
                <rect x="18" y="32" width="92" height="64" rx="4" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="3 3"/>

                <!-- Singly Outlined Perspective Quad -->
                <polygon points="32,46 96,38 90,86 36,80" stroke="#38bdf8" stroke-width="2" fill="#161b26" fill-opacity="0.6"/>

                <!-- Perspective Diagonal Axis Grid -->
                <line x1="32" y1="46" x2="90" y2="86" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
                <line x1="96" y1="38" x2="36" y2="80" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>

                <!-- Unmapped Null Indicator in Center -->
                <circle cx="64" cy="62" r="12" fill="#090b10" stroke="#a78bfa" stroke-width="1.5"/>
                <path d="M60,62 L68,62" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M64,58 L64,66" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>

                <!-- 4 Corner Pins -->
                <rect x="30" y="44" width="4" height="4" fill="#38bdf8" rx="1"/>
                <rect x="94" y="36" width="4" height="4" fill="#38bdf8" rx="1"/>
                <rect x="88" y="84" width="4" height="4" fill="#38bdf8" rx="1"/>
                <rect x="34" y="78" width="4" height="4" fill="#38bdf8" rx="1"/>
              </svg>