<svg id="lumis-mark" data-asset="lumis-mark.svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Beam Gradient Fill -->
                <linearGradient id="lumisMarkGrad" x1="28" y1="24" x2="98" y2="92" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95"/>
                  <stop offset="45%" stop-color="#A78BFA" stop-opacity="0.85"/>
                  <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4"/>
                </linearGradient>

                <!-- Optical Surface Texture -->
                <linearGradient id="lumisReflectGrad" x1="22" y1="36" x2="94" y2="82" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
                </linearGradient>

                <!-- Soft Glow Filter -->
                <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur"/>
                  <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
              </defs>

              <!-- Optic Projection Beam Frustum (Faint Projector Rays) -->
              <polygon points="12,18 108,12 92,106 20,98" stroke="#1C2230" stroke-width="1" stroke-dasharray="3 3"/>
              <line x1="12" y1="18" x2="32" y2="34" stroke="#67E8F9" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>
              <line x1="108" y1="12" x2="92" y2="26" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>
              <line x1="92" y1="106" x2="80" y2="90" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>
              <line x1="20" y1="98" x2="26" y2="86" stroke="#67E8F9" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>

              <!-- Central Calibration Crosshairs / Laser Guide -->
              <line x1="60" y1="20" x2="60" y2="100" stroke="#67E8F9" stroke-opacity="0.2" stroke-width="1"/>
              <line x1="18" y1="58" x2="102" y2="58" stroke="#67E8F9" stroke-opacity="0.2" stroke-width="1"/>

              <!-- Primary Mapped Perspective Quad (Tilted Spatial Plane) -->
              <polygon points="32,34 92,26 80,90 26,86" fill="url(#lumisMarkGrad)" fill-opacity="0.25"/>
              <polygon points="32,34 92,26 80,90 26,86" stroke="url(#lumisMarkGrad)" stroke-width="2.5" stroke-linejoin="round"/>

              <!-- Internal Specular Dispersion Facet -->
              <polygon points="32,34 68,48 54,88 26,86" fill="url(#lumisReflectGrad)"/>

              <!-- Keystone Tension Vectors / Internal Horizon Line -->
              <line x1="32" y1="34" x2="80" y2="90" stroke="#67E8F9" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3"/>
              <line x1="92" y1="26" x2="26" y2="86" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3"/>

              <!-- Physical Vertex Pins (A, B, C, D corner calibration handles) -->
              <!-- V0 - Top Left -->
              <circle cx="32" cy="34" r="3.5" fill="#090B10" stroke="#67E8F9" stroke-width="2"/>
              <circle cx="32" cy="34" r="1.5" fill="#67E8F9"/>

              <!-- V1 - Top Right -->
              <circle cx="92" cy="26" r="3.5" fill="#090B10" stroke="#A78BFA" stroke-width="2"/>
              <circle cx="92" cy="26" r="1.5" fill="#A78BFA"/>

              <!-- V2 - Bottom Right -->
              <circle cx="80" cy="90" r="3.5" fill="#090B10" stroke="#A78BFA" stroke-width="2"/>
              <circle cx="80" cy="90" r="1.5" fill="#A78BFA"/>

              <!-- V3 - Bottom Left -->
              <circle cx="26" cy="86" r="3.5" fill="#090B10" stroke="#67E8F9" stroke-width="2"/>
              <circle cx="26" cy="86" r="1.5" fill="#67E8F9"/>

              <!-- Center Homography Focus Reticle -->
              <circle cx="59" cy="58" r="4" stroke="#F4F5FA" stroke-width="1" stroke-opacity="0.7"/>
              <circle cx="59" cy="58" r="1" fill="#F4F5FA"/>
            </svg>